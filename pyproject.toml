[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Harness"
version = "3.0.0"
description = "Local coding and research CLI with deliberate context and explicit approvals"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Antareep"}]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.28,<1",
    "langchain-core>=1.4.8,<2",
    "langgraph>=1.2.6,<2",
    "langgraph-checkpoint-sqlite>=3.1.2,<4",
    "markdownify>=0.13,<2",
    "ollama>=0.6,<1",
    "prompt-toolkit>=3.0.52,<4",
    "python-dotenv>=1.2,<2",
    "pyyaml>=6,<7",
    "qdrant-client>=1.19,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "build>=1.2,<2"]

[project.scripts]
harness = "harness.cli:main"
harness-set-model = "harness.set_model:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness", "harness.*"]

[tool.setuptools.package-data]
harness = ["banner.ansi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

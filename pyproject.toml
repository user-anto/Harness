[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Harness"
version = "2.1.0"
description = "Agentic CLI Framework"
authors = [
    {name = "Antareep"}
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "langchain-core>=0.2.0",
    "langchain-ollama>=0.1.0",
    "langgraph>=0.2.0",
    "markdownify>=0.13.0",
    "ollama>=0.3.0",
    "openai>=1.0.0",
    "Pillow>=10.0.0",
    "pyfiglet>=1.0.2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "qdrant-client>=1.9.0",
    "typing-extensions>=4.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src"]